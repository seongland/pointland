version: 2
updates:
# Fetch and update latest `npm` packages, minor and patch grouped into two weekly PRs
- package-ecosystem: npm
  directory: '/'
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
  groups:
    development:
      dependency-type: development
      update-types: [minor, patch]
      patterns: ['*']
    production:
      dependency-type: production
      update-types: [minor, patch]
      patterns: ['*']
# Fetch and update latest `github-actions` pkgs, grouped into one weekly PR
- package-ecosystem: github-actions
  directory: '/'
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
  groups:
    actions:
      patterns: ['*']
